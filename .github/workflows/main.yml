name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar archivos web
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp icon.png resources/icon.png || true

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar iconos (opcional)
        run: npx capacitor-assets generate --android || true

      - name: Sincronizar web -> Android
        run: npx cap sync android

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gba-play-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
